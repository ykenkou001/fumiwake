name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # release ジョブが GitHub Release を作成するため

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: core test
        run: ./gradlew :core:test --no-daemon

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: app unit test + assemble debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # main への push 時のみ: APK を GitHub Release (tag: latest) に添付する。
  # スマホからは https://github.com/ykenkou001/fumiwake/releases/latest/download/fumiwake.apk
  # で直接ダウンロード→インストールできる。
  #
  # 署名: Secrets（SIGNING_KEYSTORE_BASE64 / SIGNING_KEY_ALIAS /
  # SIGNING_STORE_PASSWORD）が登録済みなら、固定鍵で署名した release APK を
  # 配布する（端末で上書きアップデート可能）。未登録なら従来どおり debug 署名
  # （ランナーの一時鍵）で配布する（更新時は旧版のアンインストールが必要）。
  # 手順は README「スマホへのインストール」を参照。
  release:
    if: github.ref == 'refs/heads/main'
    needs: [core-test, android-build]
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 署名鍵の Secret があれば復号してファイルに出し、signed=true を立てる。
      - name: Decode signing keystore (if provided)
        id: keystore
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            # Secret をブラウザに貼り付ける際、環境によっては base64 以外の文字が
            # 混入して GNU base64 -d が "invalid input" で落ちることがある:
            #   - Windows クリップボード由来の CR (\r): base64 -d は \n は無視するが
            #     \r は無視しない
            #   - 日本語IME由来の全角スペース(U+3000)やゼロ幅文字: [:space:] では
            #     除去されない
            # base64 の正規文字 (A-Za-z0-9+/=) 以外をすべて除去してから復号する。
            printf '%s' "$SIGNING_KEYSTORE_BASE64" \
              | tr -cd 'A-Za-z0-9+/=' \
              | base64 -d > "$RUNNER_TEMP/dist.keystore"
            if [ ! -s "$RUNNER_TEMP/dist.keystore" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 のデコード結果が空です。Secret の値を再確認してください。"
              exit 1
            fi
            echo "path=$RUNNER_TEMP/dist.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore provided: building a signed release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore secret: falling back to a debug-signed APK."
          fi

      - name: Build APK
        env:
          FUMIWAKE_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          FUMIWAKE_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          FUMIWAKE_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk fumiwake.apk
          else
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk fumiwake.apk
          fi

      - name: Publish to GitHub Release (tag latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: fumiwake latest
          files: fumiwake.apk
          make_latest: true
