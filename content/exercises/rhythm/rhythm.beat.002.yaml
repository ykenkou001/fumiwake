explanationJa: "前の譜例より長く、6小節にわたって同じ拍を数え続けます。すべて開放弦の同じ音で、4分音符だけで書かれています。それぞれの小節の1拍目（拍の頭）を意識しながら、6小節を通して「1・2・3・4」を安定したテンポで数えられるか確認しましょう。"
