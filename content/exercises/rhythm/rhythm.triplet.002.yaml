exerciseId: rhythm.triplet.002
conceptId: rhythm.triplet
prerequisites: ["rhythm.basic-values"]
titleJa: "8分と3連符を弾き分ける"
alphatex: |
  \title "8分と3連符を弾き分ける"
  \tempo 60
  .
  \ts 4 4
  0.5.8 0.5.8 0.5.8{tu 3} 0.5.8{tu 3} 0.5.8{tu 3} 0.5.4 0.5.4 |
  0.5.8{tu 3} 0.5.8{tu 3} 0.5.8{tu 3} 0.5.8 0.5.8 0.5.4 0.5.4 |
