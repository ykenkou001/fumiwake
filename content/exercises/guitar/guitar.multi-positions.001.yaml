    beatIndex: 0
    noteIndex: 0
    noteText: "5弦開放の「ラ」。"
    expectPitch: "A2"
  - barIndex: 0
    beatIndex: 1
    noteIndex: 0
    noteText: "6弦5フレット。五線上ではさっきと同じ位置に書かれる、同じ「ラ」です。"
    expectPitch: "A2"
  - barIndex: 1
    beatIndex: 0
    noteIndex: 0
    noteText: "4弦開放の「レ」。"
    expectPitch: "D3"
  - barIndex: 1
    beatIndex: 1
    noteIndex: 0
    noteText: "5弦5フレット。同じ「レ」です。"
    expectPitch: "D3"
  - barIndex: 3
    beatIndex: 0
    noteIndex: 0
    noteText: "1弦開放の「ミ」。"
    expectPitch: "E4"
  - barIndex: 3
    beatIndex: 1
    noteIndex: 0
    noteText: "2弦5フレット。ここも同じ「ミ」です。"
    expectPitch: "E4"
