exerciseId: guitar.multi-positions.001
conceptId: guitar.multi-positions
prerequisites: ["guitar.low-position", "pitch.octaves"]
titleJa: "同じ音が2箇所にある"
alphatex: |
  \title "同じ音が2箇所にある"
  \tempo 60
  .
  \ts 4 4
  0.5.4 5.6.4 0.5.4 5.6.4 |
  0.4.4 5.5.4 0.4.4 5.5.4 |
  0.3.4 5.4.4 0.3.4 5.4.4 |
  0.1.4 5.2.4 0.1.2 |
explanationJa: "五線に書かれた1つの音に対して、押さえる場所は1つとは限りません。この譜例では同じ音を「開放弦」と「1本下の弦の5フレット」で交互に鳴らします。音は同じで音色だけが違う、という点を耳でも確かめてください。"
focusElements:
